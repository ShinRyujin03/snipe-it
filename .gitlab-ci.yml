stages:
  - deploy

before_script:
  - whoami
  - pwd
  - docker --version
  - docker compose version

deploy_test:
  stage: deploy
  environment:
    name: test
  script:
    - echo "=== DEPLOY SNIPE-IT ON TEST VM ==="
    - cd /opt/snipe-it

    - echo "=== STOP OLD CONTAINER ==="
    - docker compose down || true

    - echo "=== PULL IMAGE ==="
    - docker compose pull

    - echo "=== START CONTAINER ==="
    - docker compose up -d

    - echo "=== STATUS ==="
    - docker ps -a
  only:
    - internal-deploy
