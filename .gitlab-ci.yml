stages:
  - test
  - deploy

variables:
  APP_DIR: "/opt/snipe-it"
  CONTAINER_NAME: "snipeit"

before_script:
  - whoami
  - pwd
  - docker --version
  - docker compose version || docker-compose version

# =========================
# TEST docker-compose
# =========================
test_compose:
  stage: test
  script:
    - echo "=== CHECK docker-compose ==="
    - test -f docker-compose.yml
    - docker compose config
  only:
    - test

# =========================
# DEPLOY TO VM TEST (LOCAL)
# =========================
deploy_test:
  stage: deploy
  environment:
    name: test
  script:
    - echo "=== DEPLOY LOCAL VM TEST ==="

    - cd "$APP_DIR"

    - echo "=== GIT PULL ==="
    - git pull origin internal-deploy

    - echo "=== STOP OLD CONTAINER ==="
    - docker compose down || true

    - echo "=== PULL IMAGE ==="
    - docker compose pull

    - echo "=== START CONTAINER ==="
    - docker compose up -d

    - echo "=== CONTAINER STATUS ==="
    - docker ps -a

  only:
    - internal-deploy
