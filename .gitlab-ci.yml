stages:
  - test
  - deploy

variables:
  DOCKER_BUILDKIT: "1"

before_script:
  - echo "=== CI CONTEXT ==="
  - whoami
  - hostname
  - pwd
  - docker --version
  - docker compose version || docker-compose version

# -----------------------
# TEST docker-compose
# -----------------------
test_compose:
  stage: test
  only:
    - internal-deploy
  script:
    - echo "=== CHECK FILES ==="
    - ls -la
    - test -f docker-compose.yml

    - echo "=== VALIDATE COMPOSE ==="
    - docker compose config

# -----------------------
# DEPLOY TO TEST VM
# -----------------------
deploy_test:
  stage: deploy
  only:
    - internal-deploy
  environment:
    name: test
  script:
    - echo "=== DEPLOY ON TEST VM ==="

    - echo "=== STOP OLD STACK ==="
    - docker compose down || true

    - echo "=== PULL IMAGE ==="
    - docker compose pull

    - echo "=== START STACK ==="
    - docker compose up -d

    - echo "=== VERIFY ==="
    - docker ps -a
